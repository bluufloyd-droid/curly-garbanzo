<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Documentos</title>
<meta name="description" content="Documentos publicados, listos para abrir desde un código QR.">
<link rel="icon" type="image/svg+xml" href="../qr/icono.svg">
<style>
  :root{
    --bg:#0d1117;--panel:#161b22;--panel-2:#1c232d;--line:#2a323d;
    --txt:#e6edf3;--muted:#9aa7b4;--acento:#3d9bff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;
    padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));
  }
  .hoja{max-width:720px;margin:0 auto}
  h1{margin:0 0 4px;font-size:22px}
  .bajada{margin:0 0 22px;color:var(--muted);font-size:14px}
  ul{list-style:none;margin:0;padding:0}
  li{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:10px;
  }
  li h2{margin:0 0 2px;font-size:16px}
  li h2 a{color:var(--txt);text-decoration:none}
  li h2 a:hover{color:var(--acento)}
  li p{margin:0 0 10px;color:var(--muted);font-size:13px}
  .enlaces{display:flex;gap:8px;flex-wrap:wrap}
  .enlaces a{
    font-size:13px;text-decoration:none;padding:6px 11px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--txt);
  }
  .enlaces a:hover{border-color:var(--acento)}
  .enlaces a.principal{background:var(--acento);border-color:var(--acento);color:#fff;font-weight:600}
  .vacio{color:var(--muted);font-size:14px;background:var(--panel);
    border:1px dashed var(--line);border-radius:12px;padding:16px}
  .vacio code{background:var(--panel-2);padding:1px 5px;border-radius:5px;font-size:12px}
  footer{margin-top:26px;color:var(--muted);font-size:12px}
  footer a{color:var(--acento)}
</style>
</head>
<body>
<div class="hoja">
  <h1>Documentos</h1>
  <p class="bajada">Todo lo que está acá se abre desde cualquier teléfono, sin cuenta ni instalación.
     Estos son los archivos a los que pueden apuntar los códigos QR.</p>

  <ul id="lista"></ul>
  <div id="vacio" class="vacio" hidden></div>

  <footer>
    ¿Necesitás el código QR de alguno? Armalo en el
    <a href="../qr/">generador de QR</a>.
  </footer>
</div>

<script>
(function(){
  "use strict";
  var lista = document.getElementById("lista");
  var vacio = document.getElementById("vacio");

  function mostrarVacio(texto){
    lista.hidden = true;
    vacio.hidden = false;
    vacio.innerHTML = texto;
  }

  fetch("documentos.json", { cache: "no-cache" })
    .then(function(r){
      if(!r.ok) throw new Error("sin lista");
      return r.json();
    })
    .then(function(datos){
      var docs = (datos && datos.documentos) || [];
      if(!docs.length){
        mostrarVacio("Todavía no hay documentos publicados. Subí el archivo a la carpeta " +
                     "<code>documentos/</code> del repositorio y anotalo en " +
                     "<code>documentos.json</code>.");
        return;
      }
      docs.forEach(function(doc){
        if(!doc || !doc.archivo) return;
        var li = document.createElement("li");

        var h2 = document.createElement("h2");
        var a = document.createElement("a");
        a.href = doc.archivo;
        a.textContent = doc.titulo || doc.archivo;
        h2.appendChild(a);
        li.appendChild(h2);

        if(doc.descripcion){
          var p = document.createElement("p");
          p.textContent = doc.descripcion;
          li.appendChild(p);
        }

        var enlaces = document.createElement("div");
        enlaces.className = "enlaces";
        var abrir = document.createElement("a");
        abrir.href = doc.archivo;
        abrir.className = "principal";
        abrir.textContent = "Abrir";
        var qr = document.createElement("a");
        qr.href = "../qr/?doc=" + encodeURIComponent(doc.archivo);
        qr.textContent = "Generar su QR";
        enlaces.appendChild(abrir);
        enlaces.appendChild(qr);
        li.appendChild(enlaces);

        lista.appendChild(li);
      });
    })
    .catch(function(){
      mostrarVacio("No se pudo leer <code>documentos.json</code>. Si estás abriendo esta " +
                   "página desde un archivo suelto en la computadora, probá desde el sitio publicado.");
    });
})();
</script>
</body>
</html>
